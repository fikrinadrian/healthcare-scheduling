services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-healthcare}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    networks:
      - app-network

  migrate:
    build:
      context: .
      args:
        APP: auth
    command: ['pnpm', 'prisma:migrate:deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-healthcare}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - app-network

  auth:
    build:
      context: .
      args:
        APP: auth
    command: ['node', 'dist/apps/auth/main.js']
    environment:
      AUTH_PORT: ${AUTH_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-healthcare}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret}
    ports:
      - '${AUTH_PORT:-3001}:${AUTH_PORT:-3001}'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+process.env.AUTH_PORT).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  schedule:
    build:
      context: .
      args:
        APP: schedule
    command: ['node', 'dist/apps/schedule/main.js']
    environment:
      SCHEDULE_PORT: ${SCHEDULE_PORT:-3002}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-healthcare}?schema=public
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:3001/graphql}
      AUTH_SERVICE_TIMEOUT_MS: ${AUTH_SERVICE_TIMEOUT_MS:-3000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Healthcare Scheduling <no-reply@localhost>}
    ports:
      - '${SCHEDULE_PORT:-3002}:${SCHEDULE_PORT:-3002}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
